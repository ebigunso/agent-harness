    score: 1.0
    rationale: "Detects CHECK_MODE=local left live_suite_selected false (dispatches=0); requires 'One run with CHECK_MODE=live, the service at service-box:4318 down, and the negative-control recorder active'."
  - id: 474df5fd055a
