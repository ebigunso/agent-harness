records:
  - id: a1ba6ec920c5
    fixture: tv-2-01
    score: 1.0
    rationale: "Names the unknown LIVE_PROBE value and missing service-down run, then requires 'run the gated live test once with the service deliberately down, LIVE_PROBE exported and its value shown'."
  - id: dbe786e7fb1a
    fixture: tv-2-01
    score: 1.0
    rationale: "Identifies V2 gate value unknown and V4 no service-down run; requires attaching the LIVE_PROBE value plus 'a negative-control run - service down or LIVE_PROBE off - on the same revision'."
  - id: dcc00825849e
    fixture: tv-2-01
    score: 1.0
    rationale: "Flags the uncaptured gate value and absent service-down observation; requires 'run the same target once against CHANGE with the service at service-box:4311 deliberately down'."
  - id: 086370d15a9a
    fixture: tv-2-02
    score: 1.0
    rationale: "Detects credential_present=false routing to the offline adapter; requires 're-run with credential_present=true' or a negative-control observation showing the live adapter is reached."
  - id: 2be620b1ea0a
    fixture: tv-2-02
    score: 1.0
    rationale: "Detects the credential gate routed to the offline adapter; requires 'Re-run with credential_present=true so the live probe actually executes' or a service-down negative-control run."
  - id: 4ad79e0dcec8
    fixture: tv-2-02
    score: 1.0
    rationale: "Detects credential_present=false so PASS came from the offline adapter; requires 'a run with the credential present so the live adapter is actually selected, plus the requested negative-control run (service down)'."
  - id: 525d042e102a
    fixture: tv-2-03
    score: 1.0
    rationale: "Detects the omitted optional probe (connection_attempts=0); requires 'probe gate enabled, service deliberately down, recorder captures the expected probe error' to back the claim."
  - id: 611ff7730011
    fixture: tv-2-03
    score: 1.0
    rationale: "Detects the probe was omitted (service_available=false, 0 attempts); requires 'one run with the probe gate enabled and the service deliberately down' to support the checklist line."
  - id: c5a19214cbeb
    fixture: tv-2-03
    score: 1.0
    rationale: "Detects the probe was never exercised; requires 'run one invocation with the probe gate enabled and the service deliberately down' before the live-probe claim can stand."
  - id: 00c856bbb656
    fixture: tv-2-04
    score: 1.0
    rationale: "Detects the fallback swallowed the probe outcome with no retained gate/transport events; requires 'one run with the service down and offline_fallback=0 (or the negative-control recorder attached) showing the probe error captured'."
  - id: 098b9b1aec4c
    fixture: tv-2-04
    score: 1.0
    rationale: "Detects the service-down run was neutralized by offline_fallback=1; requires 'rerun once with the service down and offline_fallback=0' retaining gate-resolution and transport events."
  - id: 1b141ccea349
    fixture: tv-2-04
    score: 1.0
    rationale: "Detects the fallback masked the probe outcome; requires 're-run the deliberate-down probe once with the negative-control recorder enabled and transport/gate-resolution events retained'."
  - id: 06331b0efba1
    fixture: tv-2-05
    score: 1.0
    rationale: "Detects the port mismatch (4415 stopped, 4315 under test); requires 'stop service-box:4315, confirm the stop on 4315, run the wrapper with the negative-control recorder attached'."
  - id: 150895a9bde8
    fixture: tv-2-05
    score: 1.0
    rationale: "Detects the stopped service was 4415 not the test endpoint 4315; requires 'Rerun on CHANGE with LIVE_PROBE=1 after stopping service-box:4315'."
  - id: 8992750db555
    fixture: tv-2-05
    score: 1.0
    rationale: "Detects the wrong endpoint was stopped; requires 'stop service-box:4315 (confirm stop on 4315), run tools/check.py at revision CHANGE with LIVE_PROBE=1 and the negative-control recorder attached'."
  - id: 6b500a72d872
    fixture: tv-2-06
    score: 1.0
    rationale: "Detects the cache hit preceded the live branch (network_attempts=0); requires a cache_mode=bypass run plus 'a service-down run under the same cache mode where the negative-control recorder captures the expected probe error'."
  - id: a07dee0ff5ee
    fixture: tv-2-06
    score: 1.0
    rationale: "Detects cache_mode=prefer short-circuited the service-down run; requires 'rerun once with the service down and the cache unable to satisfy the request' so the live branch is reached."
  - id: cbee6c2a9f22
    fixture: tv-2-06
    score: 1.0
    rationale: "Detects the live transport branch was never entered; requires reword or 'a run with the cache bypassed ... so the transport branch is entered and its error is captured' before the live claim is recorded."
  - id: 240ce11620c9
    fixture: tv-2-07
    score: 1.0
    rationale: "Detects MemoryTransport injected with socket calls=0; requires 'rerun with the live profile so the socket transport is actually registered ... and run once with the service deliberately down'."
  - id: 87912f5ea707
    fixture: tv-2-07
    score: 1.0
    rationale: "Detects the transport override (socket transport calls=0); requires 'run the gated live wrapper with the real (socket) transport registered, service down' to support the claim."
  - id: e015093d8105
    fixture: tv-2-07
    score: 1.0
    rationale: "Detects the route was replaced by MemoryTransport; requires 'attach a genuine live-route run plus its negative control' or a corrected note."
  - id: 14d7d87bdcec
