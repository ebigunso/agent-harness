# Stage 1 Rust block — 2026-08-29. 324 reviews: 3 models x arms A/B/D x 12 fixtures x 3 seeds.
# Runners: Fable via file-based clean subagents; Sol/Luna via codex exec (Stage 0 isolation,
# AGENTS.md parked during run, restored after). Fixture frontmatter (type: planted/clean)
# stripped from prompts. Graded by 9 independent Fable grader agents (one per model x arm)
# against keys/rust.md; author spot-checked sol decoys + fable-A-rs-06-s1.

detection:  # hits out of 24 (8 planted fixtures x 3 seeds), per model per arm
  fable: {A: 24, B: 24, D: 24}
  sol:   {A: 24, B: 24, D: 24}
  luna:  {A: 24, B: 24, D: 24}
# 216/216. Architectural subset (rs-03, rs-04, rs-06): also 100% in every cell,
# including arm A with no guide loaded.

decoys:
  rs-c1: {fable: flagged-all-arms, sol: clean, luna: clean}
  rs-c2: INVALIDATED  # authoring error: task framing promises a data flow the diff never
                      # implements; "task not implemented" flags are correct, not FPs
  rs-c3: INVALIDATED  # authoring error: fixture is NOT clean — debit-then-credit with `?`
                      # leaves source debited when credit fails; reviewers who blocked it
                      # were right (key rule: real authoring errors are not FPs)
  rs-c4: pre-excepted panic-on-invariant debate, mixed everywhere
# FP guard: within each model the decoy profile is identical across A/B/D — no arm
# introduces an FP regression. Fable flags rs-c1 in all three arms equally (model trait,
# not arm effect).

# ---- Pre-registered decision rule, applied ----
# dB = B - A = 0pp on architectural fixtures, worst model (all models).
# dB < 10pp  ->  OUTCOME 1: language-rust.md OBSOLETE; boundary-modeling.md (arm D)
#                measurably unnecessary at this fixture difficulty.

# ---- Caveats ----
# 1. CEILING: arm A scored 100%, so no lift was measurable. For the *content-redundancy*
#    question this is itself the answer — the fixtures are the guide's own anti-pattern
#    list, maximally favorable to the guide, and the models detect all of them unaided.
#    Stage 0's regeneration gaps (models don't VOLUNTEER these checks in the abstract)
#    did not translate into application gaps (they DO apply them to concrete code).
# 2. What this does not test: subtler/mixed-defect diffs, large diffs where salience
#    competes, or generation-time (writing code) rather than review-time behavior.
# 3. Reviewer prompt asks for "every defect you would block or flag" — an explicit
#    review framing. A guide might still matter under weaker framing.
