    seed: 1
    marks: {R1: miss, R2: miss, R3: hit, R4: hit, R5: hit, R6: hit, R7: hit, R8: miss,
            R9: hit, R10: hit, R11: hit, R12: miss, R13: hit, R14: miss, R15: hit, R16: miss}
