  - language: typescript-javascript
    seed: 2
    marks: {T1: hit, T2: hit, T3: hit, T4: hit, T5: hit, T6: hit, T7: hit, T8: hit,
            T9: hit, T10: miss, T11: hit, T12: partial, T13: hit, T14: hit, T15: hit}
    # 13.5/15 = 90%  ("fail closed for security decisions"; "trusting request bodies because they are typed")
  - language: typescript-javascript
    seed: 3
    marks: {T1: hit, T2: partial, T3: hit, T4: hit, T5: hit, T6: hit, T7: hit, T8: hit,
            T9: hit, T10: partial, T11: hit, T12: hit, T13: hit, T14: hit, T15: miss}
    # 13/15 = 87%

# ---- Summary ----
# go:                    87%  (81 / 88 / 91)  -> prima facie obsolete
# typescript-javascript: 86%  (80 / 90 / 87)  -> prima facie obsolete
# python:                77%  (61 / 75 / 96)  -> inconclusive (extreme seed variance)
# rust:                  68%  (63 / 75 / 66)  -> inconclusive -> Stage 1
#
# Sol is the strongest regenerator of the three models and uniquely recovers several
# "architectural" bullets the others never touch: validation-before-side-effects (T12),
# fail-closed (T8), invalid-states-unrepresentable (R3), consumer-owned interfaces (G1).
# Still universally missed by ALL THREE models across ALL seeds: pure-logic/IO separation
# (R8), transport-vs-domain separation (G6, R16, T10), exhaustive-match-over-if-chains
# (R14). Near-universal: newtype/primitive-obsession (R1/R12), typed dicts (P3/P12).
