            R9: hit, R10: hit, R11: hit, R12: hit, R13: hit, R14: miss, R15: hit, R16: miss}
    # 12/16 = 75%  ("invalid states are unrepresentable" verbatim)
  - language: rust
    seed: 3
    marks: {R1: miss, R2: partial, R3: hit, R4: hit, R5: hit, R6: hit, R7: hit, R8: miss,
            R9: hit, R10: hit, R11: hit, R12: miss, R13: hit, R14: miss, R15: hit, R16: miss}
