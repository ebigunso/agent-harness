# Stage 0 — gpt-5.6-sol via codex exec (clean dir, --ignore-user-config --ignore-rules
# --ephemeral, read-only sandbox, global AGENTS.md parked). Raw outputs: scratchpad probe-run/out/sol-*.txt
# Note: Sol outputs were 2-3x longer than Fable/Luna (5-11KB vs 3-4KB).
model: gpt-5.6-sol
probe_date: 2026-08-28

samples:
  - language: go
    seed: 1
    marks: {G1: partial, G2: hit, G3: hit, G4: hit, G5: miss, G6: miss, G7: hit, G8: hit,
            G9: hit, G10: hit, G11: hit, G12: hit, G13: hit, G14: hit, G15: partial, G16: hit}
    # 13/16 = 81%
  - language: go
    seed: 2
    marks: {G1: hit, G2: hit, G3: hit, G4: hit, G5: miss, G6: miss, G7: hit, G8: hit,
            G9: hit, G10: hit, G11: hit, G12: hit, G13: hit, G14: hit, G15: hit, G16: hit}
    # 14/16 = 88%
  - language: go
    seed: 3
    marks: {G1: hit, G2: hit, G3: hit, G4: hit, G5: hit, G6: miss, G7: hit, G8: hit,
            G9: hit, G10: hit, G11: hit, G12: hit, G13: hit, G14: hit, G15: partial, G16: hit}
    # 14.5/16 = 91%  ("interfaces consumer-owned, justified by substitution needs" - textbook G1/G11)

