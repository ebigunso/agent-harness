# Stage 0 results. One entry per (language, sample). Fill `marks` with hit|partial|miss.
# Paste the model's verbatim output into `raw` so scoring stays auditable.

model: ""          # e.g. claude-opus-5
probe_date: ""

samples:
  - language: go
    seed: 1
    raw: |
      <paste verbatim model output>
    marks: {G1: miss, G2: miss, G3: miss, G4: miss, G5: miss, G6: miss, G7: miss, G8: miss,
            G9: miss, G10: miss, G11: miss, G12: miss, G13: miss, G14: miss, G15: miss, G16: miss}
